# Recipes the Verifier and the Validator run. Shell lines, project root, first failure stops.
recipes:
  verify:
    - bun x tsc --noEmit
    - bun scripts/test.ts
    - bun src/cli.ts status /opt/ed/ivy
  e2e:
    ready:
      - bun src/cli.ts status .
    run:
      - bash scripts/e2e.sh
      # The two surfaces the CLI walk never reaches: the screen under keys, and the hook's
      # decision paths fired the way Claude Code fires them. Both check themselves.
      - bun scripts/tui-keys.ts --fixture --quiet --wait 20 right down down return left a f up escape d '?'
      - bun scripts/tui-keys.ts --fixture --quiet --wait 20 --row global right space return escape escape
      # The intent form: `m` opens it on a project row, and each `--expect` is the toast's own
      # words and no field label, so the line fails the moment a guard stops refusing. The refusal
      # is the assertion, not a safety: the fixture's `ivy` row is this checkout, so a regressed
      # goal guard writes a mission into `.factory/missions/` here and fails after the write.
      - bun scripts/tui-keys.ts --fixture --quiet --wait 20 --row 'p ivy' m type:x C-s --expect 'goal is empty'
      - bun scripts/tui-keys.ts --fixture --quiet --wait 20 --row 'ivy/recall' o --expect 'no goal'
      # The daemon rows: `↵` opens the DAEMON pane, `l` gives the log the pane, `Esc` goes back.
      # `r` writes nothing here — the fixture's rows are in no project's manifest, so the CLI
      # verb behind the key refuses, and the refusal is the assertion. It is given room to land.
      - bun scripts/tui-keys.ts --fixture --quiet --wait 20 --row 'ivy/cws-reviews' return escape l escape --expect 'LOG'
      - bun scripts/tui-keys.ts --fixture --quiet --wait 300 --row 'ivy/api' r --expect 'no daemon'
      - bun scripts/hook-inject.ts
    # Its own recipe, not part of `run`: the one check that spends a real model run.
    spawn:
      - REAL_HOME=$HOME HOME=$(mktemp -d /private/tmp/vspawn.XXXXXX) bun scripts/spawn.ts
