# Recipes the Verifier and the Validator run. Shell lines, project root, first failure stops.
recipes:
  verify:
    - bun x tsc --noEmit
    - bun scripts/test.ts
    - bun src/cli.ts status /opt/ed/ivy
  e2e:
    ready:
      - bun src/cli.ts status .
    run:
      - bash scripts/e2e.sh
      # The two surfaces the CLI walk never reaches: the screen under keys, and the hook's
      # decision paths fired the way Claude Code fires them. Both check themselves.
      - bun scripts/tui-keys.ts --fixture --quiet --wait 20 right down down return left a f up escape d '?'
      - bun scripts/tui-keys.ts --fixture --quiet --wait 20 --row global right space return escape escape
      # The intent form: `m` opens it on a project row, and both refusals happen before any write,
      # so the fixture pointing at this very repo is safe to drive. Each `--expect` is the toast's
      # own words and no field label, so the line fails the moment a guard stops refusing.
      - bun scripts/tui-keys.ts --fixture --quiet --wait 20 --row 'p ivy' m type:x C-s --expect 'goal is empty'
      - bun scripts/tui-keys.ts --fixture --quiet --wait 20 --row 'ivy/recall' o --expect 'no goal'
      - bun scripts/hook-inject.ts
    # Its own recipe, not part of `run`: the one check that spends a real model run.
    spawn:
      - REAL_HOME=$HOME HOME=$(mktemp -d /private/tmp/vspawn.XXXXXX) bun scripts/spawn.ts
