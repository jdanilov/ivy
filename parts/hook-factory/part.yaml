type: fixture
description: report session events to ~/.factory/events
default: true
files:
  - source: hook-factory.ts
    target: .claude/scripts/hook-factory.ts
hooks:
  - events: [SessionStart, UserPromptSubmit, Stop, SubagentStart, SubagentStop, Notification, PreCompact]
    command: bun $CLAUDE_PROJECT_DIR/.claude/scripts/hook-factory.ts ${event}
