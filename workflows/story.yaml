name: story
steps:
  - grill
  - intent:    { gate: human }
  - research:  { role: investigator }      # recovery or research pass, gates the spec
  - spec                                   # spec.md, acceptance.md
  - implement: { role: worker }
  - accept:
      parallel: [verify, validate]
      loop: { back: implement, max: 3, human_from: 2 }
  - condense:  { role: summarizer }
  - merge:     { gate: human }
